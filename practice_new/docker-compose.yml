services:
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USER:-cve_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cve_password}
      POSTGRES_DB: ${DB_NAME:-cve_database}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - db_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cve_user} -d ${DB_NAME:-cve_database}"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: always

  db_api:
    build:
      context: ./db_api
    container_name: db_api
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-cve_user}:${DB_PASSWORD:-cve_password}@postgres_db:5432/${DB_NAME:-cve_database}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    depends_on:
      postgres_db:
        condition: service_healthy
    ports:
      - "8080:8000"
    networks:
      - db_internal_net
      - service_net
      - external_net
      - debug_net
    restart: always

  nvd_parser:
    build:
      context: ./nvd_parser
    container_name: nvd_parser
    environment:
      - PYTHONUNBUFFERED=1
      - DB_API_URL=http://db_api:8000
    volumes:
      - cve_repo_data:/app/cvelistV5
    depends_on:
      - db_api
    networks:
      - service_net
      - external_net
    restart: always

  bdu_parser:
    build:
      context: ./bdu_parser
    container_name: bdu_parser
    environment:
      - PYTHONUNBUFFERED=1
      - DB_API_URL=http://db_api:8000
