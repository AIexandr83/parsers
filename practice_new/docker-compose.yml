  db_internal_net:
    internal: true
  service_net:
    internal: true
  external_net:
    driver: bridge
  debug_net:
    driver: bridge

volumes:
  pg_data:
  cve_repo_data:
  germany_state:
  japan_state:
  spain_state:
  canada_state:
  exploitdb_repo_data:
  poc_github_repo_data: